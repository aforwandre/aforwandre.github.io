<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee6" />
    <title>Jaiden 的 App</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <style>
      :root {
        --bg: #f3eee6;
        --surface: #fffaf3;
        --ink: #1a2332;
        --muted: #6b6458;
        --accent: #c4543a;
        --line: #d8d0c4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: "Noto Sans TC", "PingFang TC", "Hiragino Sans GB", sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 32px 20px 48px;
      }
      .wrap { max-width: 720px; margin: 0 auto; }
      .kicker {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--accent);
      }
      h1 {
        font-family: "Songti TC", "Noto Serif TC", serif;
        font-size: clamp(2rem, 5vw, 2.8rem);
        margin: 8px 0 8px;
        letter-spacing: -0.03em;
      }
      .lede { color: var(--muted); margin: 0 0 28px; line-height: 1.6; }
      a.card {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 18px;
        align-items: center;
        text-decoration: none;
        color: inherit;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 16px;
        box-shadow: 0 12px 32px -16px rgba(26, 35, 50, 0.18);
      }
      a.card img {
        width: 96px;
        height: 96px;
        object-fit: cover;
        border-radius: 16px;
      }
      a.card h2 { margin: 0 0 4px; font-size: 1.4rem; }
      a.card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
      a.card .go { margin-top: 8px; color: var(--accent); font-weight: 600; font-size: 14px; }
      .back { display: inline-block; margin-bottom: 18px; color: var(--muted); text-decoration: none; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="../">← 全部 App</a>
      <p class="kicker">Jaiden</p>
      <h1>Jaiden 的 App</h1>
      <p class="lede">這個資料夾以後會放 Jaiden 用的練習工具。</p>
      <a class="card" href="./Piano/">
        <img src="./Piano/mascot.jpg" alt="Jaiden 琴課" />
        <div>
          <h2>Piano · Jaiden 琴課</h2>
          <p>樂譜、拍子、聽音評分。iPad 橫放當琴譜。</p>
          <div class="go">打開琴譜 →</div>
        </div>
      </a>
    </div>
  </body>
</html>
