:root{--bg:#090b0e;--fg:#e8eef4;--muted:#8b97a6;--faint:#5c6774;--surface:#11161c;--surface2:#171e26;--buy:#3dcf9a;--sell:#f07178;--hold:#94a3b8;--border:#24303c;--accent:#5eead4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:rgba(11,13,16,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
h1{margin:0;font-size:18px;font-weight:600}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--surface);border-radius:10px;padding:16px;margin-bottom:16px}
.reg{font-size:22px;font-weight:600}
.reg.risk_on,.buy{color:var(--buy)}
.reg.risk_off,.reg.vol_spill,.sell{color:var(--sell)}
.reg.neutral,.hold{color:var(--hold)}
.snaps{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.snaps .k{color:var(--faint)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--border)}
td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.mono{font-family:"IBM Plex Mono",monospace}
.badge{display:inline-flex;min-width:42px;justify-content:center;border-radius:4px;padding:2px 8px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.k-strong_buy{background:var(--buy);color:#062016}
.k-buy{background:rgba(61,214,140,.18);color:var(--buy)}
.k-hold{background:var(--surface2);color:var(--hold)}
.k-sell{background:rgba(240,113,120,.18);color:var(--sell)}
.k-strong_sell{background:var(--sell);color:#1a0608}
.alert{display:inline-block;margin:0 4px 4px 0;padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);font-size:10px;font-family:"IBM Plex Mono",monospace}
.bar{display:inline-block;width:64px;height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:6px}
.bar>i{display:block;height:100%}
.note{color:var(--muted);font-size:12px;max-width:52rem}
.foot{color:var(--faint);font-size:11px;padding:8px 16px 24px}
a{color:var(--buy)}
@media(max-width:720px){.hide-sm{display:none}}
</style>

document.getElementById("regime").innerHTML=`
  <div class="k">市場 Regime</div>
  <div class="reg ${rg.id||"neutral"}">${rg.labelZh||"—"} <span style="font-size:13px;font-weight:400;color:var(--muted)">${rg.labelEn||""}</span></div>
  <p class="note">${rg.note||""}</p>
  <div class="snaps">
    ${(board.snapshots||[]).map(s=>`<div><div class="k">${s.name}</div><div>${fmtPx(s.last)} <span class="${s.chgPct>=0?"buy":"sell"}">${fmtPct(s.chgPct)}</span></div></div>`).join("")}
    <div><div class="k">Vol 20/60</div><div>${(rg.hsiVol20??0).toFixed(1)} / ${(rg.hsiVol60??0).toFixed(1)}</div></div>
    <div><div class="k">籃子上漲比</div><div>${((rg.breadth||0)*100).toFixed(0)}%</div></div>
    <div><div class="k">信心</div><div>${rg.confidence??"—"}</div></div>
  </div>`;
const tb=document.getElementById("rows");
for(const r of board.rows||[]){
  const s=r.signal||{};
  const kind=s.kind||"hold";
  const chg=r.chgPct;
  const alerts=(s.alerts||[]).map(a=>`<span class="alert">${ALERT[a]||a}</span>`).join("")||"—";
  const w=Math.max(0,Math.min(100,s.strength||0));
  const barCol=w>=70?"var(--buy)":w<=30?"var(--sell)":"var(--hold)";
  const tr=document.createElement("tr");
  tr.innerHTML=`
    <td class="mono">${r.ticker}</td>
    <td>${r.name||""}</td>
    <td class="mono">${fmtPx(r.last)}</td>
    <td class="mono ${chg>0?"buy":chg<0?"sell":""}">${fmtPct(chg)}</td>
    <td><span class="badge k-${kind}">${KIND[kind]||kind}</span></td>
    <td class="mono"><span class="bar"><i style="width:${w}%;background:${barCol}"></i></span>${s.strength??"—"}</td>
    <td class="mono hide-sm">${Number.isFinite(r.pctb)?r.pctb.toFixed(2):"—"}</td>
    <td class="mono hide-sm">${Number.isFinite(r.rsi)?r.rsi.toFixed(0):"—"}</td>
    <td class="hide-sm">${alerts}</td>
    <td class="mono hide-sm">${r.lastBuyAt||"—"}</td>`;
  tb.appendChild(tr);
}
document.getElementById("foot").innerHTML=
  `${board.disclaimer||"非投資建議。"} 來源：${board.source||""} · 發佈 ${board.publishedAt||""} · <a href="${board.pagesUrl||"https://aforwandre.github.io/Andre/MDX_Scan/"}">aforwandre.github.io/Andre/MDX_Scan</a>`;
</script>
</body>
</html>
