<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#090b0e"/>
<title>Andre</title>
<link rel="icon" type="image/svg+xml" href="./MDX_Scan/icon.svg"/>
<style>
:root { --bg:#090b0e; --surface:#11161c; --ink:#e8eef4; --muted:#8b97a6; --accent:#5eead4; --line:#24303c; }
* { box-sizing:border-box; }
body { margin:0; min-height:100dvh; font-family:-apple-system,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); padding:32px 20px 48px; }
.wrap { max-width:720px; margin:0 auto; }
.kicker { font-size:13px; font-weight:600; letter-spacing:.08em; color:var(--accent); }
h1 { font-size:clamp(1.8rem,4vw,2.4rem); margin:8px 0; }
.lede { color:var(--muted); margin:0 0 28px; line-height:1.6; }
a.card { display:block; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; }
a.card h2 { margin:0 0 6px; }
a.card p { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }
.go { margin-top:10px; color:var(--accent); font-weight:600; font-size:14px; }
.back { display:inline-block; margin-bottom:18px; color:var(--muted); text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 全部 App</a>
  <p class="kicker">Andre</p>
  <h1>Andre 的工具</h1>
  <p class="lede">這個資料夾放 Andre 自己用的監測與掃描工具。</p>
  <a class="card" href="./MDX_Scan/">
    <h2>MDX_Scan · 港股獨立訊號板</h2>
    <p>恒指三大指數 + 25 隻藍籌的 MDX 買／賣／持有。靜態副本，對應 grok.me 儀表板。</p>
    <div class="go">打開訊號板 →</div>
  </a>
</div>
</body>
</html>
